<link rel="import" href="/custom-elements/polymer/polymer.html?v=<%= dumaos_version %>&lang=<%= lang %>&theme=<%= current_theme %>&themeVersion=<%= current_theme_version %>"> <link rel="import" href="/custom-elements/iron-flex-layout/iron-flex-layout.html?v=<%= dumaos_version %>&lang=<%= lang %>&theme=<%= current_theme %>&themeVersion=<%= current_theme_version %>"> <link rel="import" href="/custom-elements/paper-toggle-button/paper-toggle-button.html?v=<%= dumaos_version %>&lang=<%= lang %>&theme=<%= current_theme %>&themeVersion=<%= current_theme_version %>"> <link rel="import" href="/custom-elements/paper-icon-button/paper-icon-button.html?v=<%= dumaos_version %>&lang=<%= lang %>&theme=<%= current_theme %>&themeVersion=<%= current_theme_version %>"> <link rel="import" href="/custom-elements/iron-icons/iron-icons.html?v=<%= dumaos_version %>&lang=<%= lang %>&theme=<%= current_theme %>&themeVersion=<%= current_theme_version %>"> <link rel="import" href="/custom-elements/iron-icons/image-icons.html?v=<%= dumaos_version %>&lang=<%= lang %>&theme=<%= current_theme %>&themeVersion=<%= current_theme_version %>"> <link rel="import" href="/apps/com.netdumasoftware.benchmark/desktop/DomModules/benchmark-schedule-entry.html?v=<%= dumaos_version %>&lang=<%= lang %>&theme=<%= current_theme %>&themeVersion=<%= current_theme_version %>"> <link rel="import" href="/libs/jquery.html?v=<%= dumaos_version %>&lang=<%= lang %>&theme=<%= current_theme %>&themeVersion=<%= current_theme_version %>"> <link rel="import" href="/libs/cron.html?v=<%= dumaos_version %>&lang=<%= lang %>&theme=<%= current_theme %>&themeVersion=<%= current_theme_version %>"> <!-- Theme, loaded last --> <link rel="import" href="/themes/<%= current_theme %>/duma-theme.html?v=<%= dumaos_version %>&lang=<%= lang %>&theme=<%= current_theme %>&themeVersion=<%= current_theme_version %>"> <dom-module id="benchmark-schedules"> <template> <style is="custom-style" include="iron-flex iron-flex-alignment duma-theme"> :host {
        display: block;
      }
      ::content #scheduleTable {
        width: 100%;
        transform-origin: top right;
        @apply(--layout-horizontal);
        position: relative;
        z-index: -1;
      }
      ::content .center {
        display: flex;
        align-items: center;
        height: 100%;
        justify-content: center;
        /* justify-content: flex-end;
        margin-right: 8px; */
      }
      ::content .scheduleTable-wrap {
        @apply(--layout-horizontal);
        border: thin solid var(--divider-color);
        border-width: thin 0 thin 0;
        position: relative;
        z-index: 0;
      }
      ::content #header {
        background-color: var(--transparent-background-color);
        @apply(--layout-vertical);
        min-width: 164px;
      }
      ::content #header > div:not(:first-child) {
        border-top: thin solid var(--divider-color);
      }
      ::content .schedule-title {
        @apply(--paper-font-subhead);
        flex-grow: 1;
      }
      ::content #header .schedule-header {
        height : 64px;
      }
      ::content #header .schedule-row {
        height: 48px;
        line-height: 48px;
        padding: 0 16px;
        white-space: nowrap;
        text-align: end;
      }
      ::content #tableWrap  {
        overflow: hidden;
        width: 100%;
      }
      ::content #slider {
        --paper-slider-active-color: transparent;
        --paper-slider-knob-start-color: var(--primary-color);
        --paper-slider-knob-start-border-color: transparent;
      }
      ::content .slider-labels  {
        @apply(--layout-horizontal);
      }
      ::content .slider-labels > div:first-child {
        @apply(--layout-flex);
      }
      :host ::content benchmark-schedule-entry:nth-child(even){
        background: rgba(var(--primary-background-rgb), 0.25);
      } </style> <div class="layout vertical"> <div class="scheduleTable-wrap"> <!-- Row titles --> <div id="header"> <div class="schedule-header"> <div class="center"> <paper-button id="add_test" background on-click="add_test"><%= i18n.addTest %></paper-button> </div> </div> <!-- Spacer so titles align with  rows --> <div class="schedule-row"><%= i18n.time %></div> <div class="schedule-row"><%= i18n.date %></div> <div class="schedule-row"><%= i18n.labelRepeat %></div> </div> <!-- Entries --> <div id="scheduleTable"> <template is="dom-repeat" items="[[schedules]]" as="schedule" sort="_scheduleSort"> <benchmark-schedule-entry schedule="[[schedule]]" on-click="_editClick"></benchmark-schedule-entry> </template> </div> </div> <div class="inner"> <paper-slider id="slider" value="0" immediate-value="{{sliderPos}}"></paper-slider> <div class="slider-labels"> <div><%= i18n.soonest %></div> <div><%= i18n.latest %></div> </div> </div> </div> </template> <script> Polymer(
    {
      is: 'benchmark-schedules',
      properties:
      {
        // {
        //   time: "19:00",
        //   date: "Daily | Every Tuesday | Mo Tu Th Fr | 19/10",
        //   repeat: false,
        //   failed: false,
        //   id: ""
        // }
        schedules: {
          type: Array,
          value: []
        },
        sliderPos:
        {
          type: Number,
          observer: '_sliderPositionChanged',
        },
      },

      _scheduleSort: function(a,b){
        if(!a.next) return 1;
        if(!b.next) return -1;
        return a.next.getTime() - b.next.getTime();
      },

      _editClick: function(e){
        var schedule = $(e.target).closest("benchmark-schedule-entry").prop("schedule");
        if(schedule){
          this.add_schedule.open(schedule.rule.id,this.reload_schedules.bind(this));
        }
      },

      ready: function(){
        this.add_schedule = $(this).closest("duma-panel").find("benchmark-add-scheduled")[0];
        setTimeout(this.reload_schedules.bind(this),100)
        window.addEventListener("resize", () => this.setSliderPosition(this.sliderPos));
      },
        
      reload_schedules: function(){
        long_rpc_promise("com.netdumasoftware.benchmark","get_cron_rules",[]).done(function(result){
          result = result[0] ? JSON.parse(result[0]) : [];
          var keys = Object.keys(result);
          var schedules = [];
          for(var i = 0; i < keys.length; i ++){
            var rule = result[keys[i]];
            schedules.push(this.makeSchedule(rule.schedule, !rule.one_time, rule.failed, rule));
          }
          this.set("schedules",schedules);
          Polymer.RenderStatus.afterNextRender(this, () =>
          {
            this.setSliderPosition(0);
          });
        }.bind(this));
      },

      add_test: function(){
        this.add_schedule.open(null,this.reload_schedules.bind(this));
      },

      makeSchedule: function(cron, repeat, failed, rule){
        var presets = this.add_schedule.presets;
        var newEntry = {
          time: "",
          date: "",
          repeat: repeat,
          failed: failed,
          rule: rule,
          next: (new Cron(rule.schedule)).next(24 * 3600 * 366 * 1000,60 * 1000),
          cron: cron
        }
        if(typeof(cron) === "string") cron = new Cron(cron);
        var minute = 0;
        for(var i = 0; i < cron.minutes.length; i++){
          if(cron.minutes[i]){
            minute = i < 10 ? "0" + i.toString() : i.toString()
            break;
          }
        }
        var hour = 0;
        for(var i = 0; i < cron.hours.length; i++){
          if(cron.hours[i]){
            hour = i < 10 ? "0" + i.toString() : i.toString();
            break;
          }
        }
        newEntry.time = hour + ":" + minute;

        if(presets && presets.length){
          for(var i = 0; i < presets.length; i++){
            var pre = presets[i];
            if(pre.cron && pre.cron.matches(cron,true)){
              newEntry.date = pre.display;
              return newEntry;
            }
          }
        }

        var daysShort = ["<%= i18n.sundayShort %>","<%= i18n.mondayShort %>","<%= i18n.tuesdayShort %>","<%= i18n.wednesdayShort %>","<%= i18n.thursdayShort %>","<%= i18n.fridayShort %>","<%= i18n.saturdayShort %>"];
        var days = ["<%= i18n.sunday %>","<%= i18n.monday %>","<%= i18n.tuesday %>","<%= i18n.wednesday %>","<%= i18n.thursday %>","<%= i18n.friday %>","<%= i18n.saturday %>"];
        var activeDays = [];
        for(var i = 0; i < cron.weekdays.length; i++){
          if(cron.weekdays[i]){
            activeDays.push([daysShort[i],days[i]]);
          }
        }
        if(activeDays.length === 7){
          var months = ["<%= i18n.january %>","<%= i18n.february %>","<%= i18n.march %>","<%= i18n.april %>","<%= i18n.may %>","<%= i18n.june %>","<%= i18n.july %>","<%= i18n.august %>","<%= i18n.september %>","<%= i18n.october %>","<%= i18n.november %>","<%= i18n.december %>"];
          var monthsShort = ["<%= i18n.jan %>","<%= i18n.feb %>","<%= i18n.mar %>","<%= i18n.apr %>","<%= i18n.mayShort %>","<%= i18n.jun %>","<%= i18n.jul %>","<%= i18n.aug %>","<%= i18n.sep %>","<%= i18n.oct %>","<%= i18n.nov %>","<%= i18n.dec %>"];
          var activeMonths = [];
          var activeDates = [];
          var dateGaps = [];
          for(var m = 0; m < cron.months.length; m ++){
            if(cron.months[m]) activeMonths.push([monthsShort[m],months[m]]);
          }
          for(var d = 0; d < cron.days.length;d ++){
            if(cron.days[d]){
              if(activeDates.length){
                dateGaps.push(d - activeDates[activeDates.length-1]);
              }
              activeDates.push(d + 1);
            }
          }
          for(var i = 1; i < dateGaps.length; i++){
            if(dateGaps[i] !== dateGaps[i-1]){
              dateGaps = -1;
              break;
            }
          }
          if(typeof(dateGaps) !== "number") dateGaps = dateGaps[0];

          if(activeMonths.length === 12){
            if(activeDates.length === 31)
              newEntry.date = "<%= i18n.daily %>";
            else if(dateGaps){
              newEntry.date = "<%= i18n.every_days %>".format(dateGaps);
            }else{
              newEntry.date = "<%= i18n.every_month_on %> " + (activeDates[0] < 10 ? "0" + activeDates[0].toString() : activeDates[0].toString());
            }
          }else{
            newEntry.date = "<%= i18n.oneTime %>";//newEntry.next.toLocaleString({},{day:"2-digit",month:"short",year:"2-digit"});
          }
        }else if(activeDays.length === 1){
          newEntry.date = activeDays[0][1];
        // }else if(activeDays.length === 2 && activeDays[0][0] === "Su" && activeDays[1][0] === "Sa"){
        //   newEntry.date = "Every Weekend";
        // }else if(activeDays.length === 5 && activeDays[0][0] === "Mo" && activeDays[4][0] === "Fr"){
        //   newEntry.date = "Every Weekday";
        }else{
          newEntry.date = "SHOW_DAYS";
        }
        return newEntry;
      },

      _sliderPositionChanged: function(newValue, oldValue)
      {
        this.setSliderPosition(newValue);
      },

      setSliderPosition: function(value)
      {
        this.sliderPos = value;
        var table = $("#scheduleTable", this);
        var header = $("#header", this);
        var children = table.children();
        var sumWidth = 0;
        for(var c = 0; c < children.length; c++){
          sumWidth += children[c].clientWidth;
        }
        var bonusOffset = (table[0].scrollWidth > table.width()) ? header.width() : (sumWidth >= (table.width()) ? header.width() : 0);
        var pos = (table[0].scrollWidth - table.width() + bonusOffset) * (value / 100)
        table.css(
        {
        "transform": "translateX(-" + pos + "px)"
        });
      }
    }); </script> </dom-module>
