<link rel="import" href="/custom-elements/iron-icons/iron-icons.html"> <link rel="import" href="/custom-elements/iron-pages/iron-pages.html"> <link rel="import" href="/custom-elements/iron-flex-layout/iron-flex-layout.html"> <link rel="import" href="/apps/com.netdumasoftware.benchmark/desktop/DomModules/benchmark-rating-icon.html"> <link rel="import" href="/custom-elements/polymer/polymer.html"> <link rel="import" href="/apps/com.netdumasoftware.benchmark/desktop/DomModules/duma-speed-rating.html"> <link rel="import" href="/apps/com.netdumasoftware.benchmark/desktop/DomModules/duma-ping-rating.html"> <link rel="import" href="/apps/com.netdumasoftware.benchmark/desktop/DomModules/duma-bloat-rating.html"> <link rel="import" href="/apps/com.netdumasoftware.benchmark/desktop/DomModules/rating.html"> <script src="/apps/com.netdumasoftware.benchmark/desktop/Scripts/shared.js"></script> <!-- Theme, loaded last --> <link rel="import" href="/themes/<%= current_theme %>/duma-theme.html"> <dom-module id="benchmark-history-entry"> <template> <style is="custom-style" include="duma-theme iron-flex"> :host  {
        min-width: 112px;
        padding: 16px 0 0 0;
        @apply(--layout-self-stretch);
        @apply(--layout-vertical);
        @apply(--layout-center);
        transition: background 150ms ease-in-out;
        text-align: center;
        position: relative;
        cursor: pointer;
      }
      :host:hover {
        background-color: rgba(var(--primary-background-rgb), 0.5) !important;
      }      
      ::content .history-header {
        height: 48px;
        padding: 0 16px;
        width: 100%;
        box-sizing: border-box;
      }
      ::content .history-date {
        text-overflow: ellipsis;
        width: 100%;
        white-space: nowrap;
        overflow: hidden;
      }
      ::content iron-pages {
        width: 100%;
       }
      ::content .history-row {
        height: 48px;
        display: block;
        margin-top: 3px;
      }
      ::content .history-row duma-rating {
        display: flex;
        justify-content: center;
      }
      ::content .history-date {
        color: var(--secondary-text-color);
      }
      ::content .bg {
        background-color: rgba(var(--primary-background-rgb), 0.25);
      }
      ::content .history-row paper-icon-button#deleteTest {
        margin: 4px;
      } </style> <!-- History Rating Entry dom start --> <div class="history-header"> <div class="history-time"> <div>[[time]]</div> </div> <div class="history-date">[[date]]</div> </div> <iron-pages selected="[[failed]]"> <iron-page> <duma-speed-rating id="speed" class="history-row"></duma-speed-rating> <duma-ping-rating id="ping" class="history-row"></duma-ping-rating> <duma-bloat-rating id="bloat" class="history-row" thresholds$="[[bloatThreshold]]"></duma-bloat-rating> </iron-page> <iron-page> <div class="history-row"></div> <div class="history-row"></div> <div class="history-row"> <paper-icon-button id="deleteTest" icon="delete-forever"></paper-icon-button> </div> </iron-page> </iron-pages> </template> <script> Polymer({
      is: 'benchmark-history-entry',
      properties:
      {
        date: String,
        time: String,
        speedThreshold: Object,
        pingThreshold: Object,
        bloatTreshold: Object,
        oldSpeeds: Object,
        failed:
        {
          type: Boolean,
          value: true,
        },
        id:
        {
          type: Number,
          value: 0,
        }
      },
      networkSpeedChange: function(newUpload,newDownload){
        if(!this.oldSpeeds) return;
        
        var speedRating = this.$$("#speed");
        speedRating.setRating(this.oldSpeeds.upload / newUpload, this.oldSpeeds.download / newDownload);
      },
      pass: function(index, speedUpload, expectedUpload, speedDownload, expectedDownload, ping, jitter, dropRate, bloatUp, bloatDown, bloatIdle)
      {
        this.id = index;
        this.failed = false;

        // Speed
        var speedRating = this.$$("#speed");

        speedRating.set("tooltip.line0", FormatBytes(speedDownload * 1000, 1000));
        speedRating.set("tooltip.line1", FormatBytes(speedUpload * 1000, 1000));
        speedRating.set("tooltip.line2", GetNetflixRating(speedDownload));

        speedRating.setRating(speedUpload / expectedUpload, speedDownload / expectedDownload);
        this.oldSpeeds = {upload: speedUpload, download: speedDownload};

        // Ping
        var pingRating = this.$$("#ping");

        pingRating.set("tooltip.line0", ping.toFixed(1) + " ms");
        pingRating.set("tooltip.line1", jitter.toFixed(1) + " ms");
        pingRating.set("tooltip.line2", dropRate.toFixed(1) + "%");
        pingRating.setRating(ping, jitter, dropRate);

        // Bloat
        var bloatRating = this.$$("#bloat");

        bloatRating.set("tooltip.line0", bloatDown.toFixed(1) + " ms");
        bloatRating.set("tooltip.line1", bloatUp.toFixed(1) + " ms");
        bloatRating.set("tooltip.line2", bloatIdle.toFixed(1) + " ms");

        bloatRating.setRating(bloatUp, bloatDown, bloatIdle);
      },
      fail: function(index)
      {
        this.id = index;
        this.failed = true;

        this.$.deleteTest.addEventListener("tap", this.deleteTest.bind(this));
      },
      deleteTest: function()
      {
        long_rpc_promise("com.netdumasoftware.benchmark", "delete_entry",[this.id]).done(function() { this.fire("reload-history")}.bind(this));
      },
    }); </script> </dom-module>
