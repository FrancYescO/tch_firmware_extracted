<link rel="import" href="/custom-elements/polymer/polymer.html?v=<%= dumaos_version %>&lang=<%= lang %>&theme=<%= current_theme %>&themeVersion=<%= current_theme_version %>"> <link rel="import" href="/apps/com.netdumasoftware.benchmark/desktop/DomModules/rating.html?v=<%= dumaos_version %>&lang=<%= lang %>&theme=<%= current_theme %>&themeVersion=<%= current_theme_version %>"> <link rel="import" href="/libs/jquery.html?v=<%= dumaos_version %>&lang=<%= lang %>&theme=<%= current_theme %>&themeVersion=<%= current_theme_version %>"> <dom-module id="duma-ping-rating"> <template> <style> </style> <!-- local DOM HTML --> <duma-rating id="rating" animated="[[animated]]" tooltip="[[tooltip]]" tooltip-icons="[[tooltipIcons]]" thresholds="[[thresholds]]"></duma-rating> </template> <script> Polymer(
    {
      is: 'duma-ping-rating',
      properties:
      {
        animated:
        {
          type: Boolean,
          value: false,
        },
        thresholds:
        {
          type: Object,
          value:
          {
            max: 80,

            limits: 
            [
              {
                letter: "D",
                limit: 20,
                colour: "<%= theme.RATING_D %>",
              },
              {
                letter: "C",
                limit: 30,
                colour: "<%= theme.RATING_C %>",
              },
              {
                letter: "B",
                limit: 45,
                colour: "<%= theme.RATING_B %>",
              },
              {
                letter: "A",
                limit: 55,
                colour: "<%= theme.RATING_A %>",
              },
              {
                letter: "A+",
                limit: 60,
                colour: "<%= theme.RATING_APLUS %>",
              }
            ],
          }
        },
        tooltipIcons:
        {
          type: Object,
          value:
          {
            0: "<%= i18n.average %>",
            1: "<%= i18n.jitter %>",
            2: "<%= i18n.packetLoss %>",
          },
        },
        tooltip:
        {
          type: Object,
          value: function ()
          {
            return {
              line0: "",
              line1: "",
              line2: "",
            };
          },
        },
      },

      // Upload and download as percentages of expected speeds
      setRating: function (ping, jitter, droppedPercent)
      {
        var droppedPackets = droppedPercent;
        // Ping rating is calculated by adding the average ping and jitter
        // then dropping 10 points (typically a whole level) for every dropped packet
        var score = Math.min(Math.max((80 - ping) + jitter - (10 * droppedPackets), 0), 80);

        this.$.rating.setRating(score);
      },

      reset: function ()
      {
        this.$.rating.reset();
      },
    }); </script> </dom-module>
