user nobody nogroup;
# DO NOT EVER change the number of worker processes!
worker_processes  1;

error_log   syslog:server=unix:/dev/log,facility=daemon,nohostname warn;

events {
    worker_connections  256;
}

http {
    access_log  off;
    server_tokens off;

    include     mime.types;
    lua_package_path ';;${prefix}lib/lua/?.lua;/www/lua/?.lua';
    lua_package_cpath '${prefix}lib/lua/?.so';

    keepalive_timeout  65;
    add_header X-Frame-Options SAMEORIGIN;

    init_by_lua '
        local state_dir = "/var/run/assistance"
        local cmd = string.format("if [ ! -d %s ]; then mkdir %s && chown nobody %s; fi;rm -f %s/*", state_dir, state_dir, state_dir, state_dir)
        os.execute(cmd)
    ';
    init_worker_by_lua '
        local sessioncontrol = require("web.sessioncontrol")
        sessioncontrol.setManagerForPort("default", "80")
        sessioncontrol.setManagerForPort("default", "443")
        sessioncontrol.setManagerForPort("assistance", "65443")
    ';

    server {
        # ipv4
        listen       80;
        listen       443 ssl;
        listen       65443 ssl;
        # ipv6
        listen       [::]:80;
        listen       [::]:443 ssl;
        listen       [::]:65443 ssl;

        ssl_certificate /etc/nginx/server.crt;
        ssl_certificate_key /etc/nginx/server.key;
        # based on https://wiki.mozilla.org/Security/Server_Side_TLS
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:!DSS;
        ssl_prefer_server_ciphers on;
        ssl_session_tickets off;

        server_name  localhost;
        root /www/docroot;
        client_body_buffer_size 64k;

        # platform/custo specific values
        include ui_server.conf;

        location = / {
            index home.lp;
        }

        location = /start {
            content_by_lua '
              ngx.redirect("/activation-wizard.lp")
            ';
        }

        location ^~ /css/ {
          #do nothing
        }

        location ^~ /img/ {
          #do nothing
        }

        location ^~ /fonts/ {
          #do nothing
        }

        location ^~ /js/ {
          #do nothing
        }

        location ^~ /intercept.lp {
          content_by_lua '
            require("web.web").process()
          ';
        }

        location ^~ /no-internet-connection-adsl.lp {
          content_by_lua '
            require("web.web").process()
          ';
        }

        location ^~ /no-internet-connection-ftth.lp {
          content_by_lua '
            require("web.web").process()
          ';
        }

        location ^~ / {
            access_by_lua '
              require("web.assistance").enable()
              local mgr = require("web.sessioncontrol").getmgr()
              if ngx.var.request_method == "GET" and ngx.req.get_uri_args().getSessionStatus == "true" then
                mgr:checkrequest(true) -- do not renew the session while checking session status
              else
                mgr:checkrequest()
              end
              mgr:handleAuth()
              local content_security = "default-src \'self\';script-src \'self\' \'unsafe-eval\' \'unsafe-inline\';style-src \'self\' \'unsafe-inline\';"
	      if ngx.var.request_method == "POST" and not ngx.ctx.session:retrieve("isUpload") and ngx.req.get_post_args().isIPChanged == "1" then
                content_security = string.format("%s connect-src \'self\' http://%s;", content_security, ngx.req.get_post_args().IPAddress)
              end
              ngx.header["Content-Security-Policy"] = content_security
            ';
            content_by_lua '
              require("web.web").process()
            ';
        }

        # additional/custom configuration
        include main_*.conf;
    }

    server {
        listen       127.0.0.1:55555;
        server_name  127.0.0.1;
        root         /www;

        location = /ra {
            access_by_lua '
              require("web.assistance").enable()
            ';

            content_by_lua '
              require("assistance_helper").process()
          ';
        }

        location = /reloadWebUsers {
            content_by_lua '
              require("web.sessioncontrol").reloadUsers()
            ';
        }
    }

    server {
        # ipv4
        listen 8080 tproxy;
        # ipv6
        listen [::]:8080 tproxy;

        #access_log /var/log/nginx/intercept.log;

        access_by_lua '
          local req_uri = ngx.var.http_host .. ngx.unescape_uri(ngx.var.request_uri)
          ngx.log(ngx.NOTICE, "Intercept: uri=" .. string.untaint(req_uri))
          local proxy = require("datamodel")
          local ip = proxy.get("uci.network.interface.@lan.ipaddr")[1].value
          local mode = proxy.get("uci.wansensing.global.l2type")[1].value
          if string.match(mode, "^[AV]DSL$") then
             ngx.redirect(string.format("http://%s/no-internet-connection-adsl.lp?url=%s",ip,req_uri))
          elseif mode == "ETH" then
             ngx.redirect(string.format("http://%s/no-internet-connection-ftth.lp?url=%s",ip,req_uri))
          else
             ngx.redirect(string.format("http://%s/intercept.lp?url=%s",ip,req_uri))
          end
        ';
    }
}
