--> <script> var Duma = Duma || {};
  Duma.InputBehavior = {
    properties: {
      value: {
        type: String,
        notify: true,
      },
      invalid: {type: Boolean, value: true},
      errorMessage: { type: String, value: "Invalid" },
      parts: Array,
      disabled: Array,
      allowEmpty: Boolean
    },

    validate: function () {
      var valid = (this.allowEmpty && (this.value == undefined || this.value.trim() == "...")) || this.$$(".paper-input-input").validate(this.value);
      //this.$$("paper-input-error").update({invalid: !valid});
      //this.$$("paper-input-container").invalid = !valid;
      this.invalid = !valid;
      return valid;
    },

    _isDisabled: function (disabled) {
      if (typeof(disabled) === "boolean") {
        return disabled;
      } else {
        return false;
      }
    }
  }; </script>
