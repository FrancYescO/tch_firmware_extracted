<%
  require("libos")
  local platform = os.platform_information()
%>

<!DOCTYPE HTML>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Authenticate App</title>
  </head>
  <body>

    <script type="text/javascript">
      var port = location.port ? ":" + location.port : "";
      <% if platform.odm == "SEAL" then %>
      var path = "/dumaos/desktop/webview.html?cache=0"
      <% else %>
      var path = "/desktop/index.html?cache=0"
      <% end %>
      var url = location.protocol + "//" + location.hostname + port + path;
      window.location.replace(url);
    </script>

    You should not see this.
  </body>
</html>
